name: Apply approved Home Wall
on:
  push:
    branches:
      - bingo-storage-preview-repair-2026-09-27
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bingo-storage-preview-repair-2026-09-27
      - name: Patch mother file
        env:
          BINGO_PATCH_B64: 
        run: |
          python3 -c "import os,base64,pathlib; p=pathlib.Path('BINGO_MASTER_CURRENT_VERIFIED.html'); s=p.read_text(); marker='bingo-approved-home-wall-20261002'; patch=base64.b64decode(os.environ['BINGO_PATCH_B64']).decode(); assert marker not in s; assert '</body>' in s; p.write_text(s.replace('</body>',patch+'\\n</body>',1))"
      - name: Commit
        run: |
          git config user.name "Bingo Deployment Bot"
          git config user.email "actions@users.noreply.github.com"
          git add BINGO_MASTER_CURRENT_VERIFIED.html
          git diff --cached --check
          git commit -m "Apply approved view-only Home Feed and white Bingo Wall"
          git push origin HEAD:bingo-storage-preview-repair-2026-09-27
