name: Apply approved Home Feed and Bingo Wall layout
on:
  push:
    branches: [bingo-storage-preview-repair-2026-09-27]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bingo-storage-preview-repair-2026-09-27
          fetch-depth: 0
      - name: Apply surgical approved Home/Wall presentation
        shell: python
        run: |
          from pathlib import Path
          p=Path("BINGO_MASTER_CURRENT_VERIFIED.html")
          s=p.read_text(encoding="utf-8")
          marker="bingo-approved-home-wall-20261002"
          if marker in s:
              raise SystemExit("Approved Home/Wall patch already present")
          patch=r'''<style id="bingo-approved-home-wall-20261002">
/* Approved 2026-10-02: white flat Wall + view-only Home discovery. Presentation only. */
#auto-arcade-widget .bingo-topic-page{background:#fff!important;color:#101820!important;max-width:760px!important;padding-left:0!important;padding-right:0!important}
#auto-arcade-widget .bingo-topic-brand{background:#fff!important}
#auto-arcade-widget .bingo-topic-brand h1{color:#101820!important}
#auto-arcade-widget .bingo-approved-topic{background:#fff!important;color:#101820!important;border:0!important;border-radius:0!important;box-shadow:none!important;margin:0 auto 18px!important;padding:0 16px 18px!important;max-width:760px!important}
#auto-arcade-widget .bingo-approved-topic .aa-post-media{border-radius:0!important;margin-left:-16px!important;margin-right:-16px!important}
#auto-arcade-widget .bingo-approved-topic .aa-post-head{padding-top:14px!important;margin-bottom:14px!important}
#auto-arcade-widget .bingo-approved-topic .bingo-topic-author b,
#auto-arcade-widget .bingo-approved-topic .aa-post-title,
#auto-arcade-widget .bingo-approved-topic .aa-post-message{color:#101820!important;text-shadow:none!important}
#auto-arcade-widget .bingo-approved-topic .bingo-topic-author .meta,
#auto-arcade-widget .bingo-approved-topic .bingo-topic-summary{color:#697386!important}
#auto-arcade-widget .bingo-approved-topic .bingo-topic-summary,
#auto-arcade-widget .bingo-approved-topic .bingo-topic-actions{border-color:#e6e8ec!important}
#auto-arcade-widget .bingo-approved-topic .bingo-topic-actions button{color:#101820!important}
#auto-arcade-widget .bingo-approved-topic .bingo-topic-actions button+button{border-left-color:#e6e8ec!important}
#auto-arcade-widget .bingo-approved-topic .bingo-topic-field{background:#f6f7f9!important;border-color:#d9dde3!important}
#auto-arcade-widget .bingo-approved-topic .bingo-topic-field input.field{color:#101820!important}
#auto-arcade-widget .bingo-approved-topic .bingo-topic-field input::placeholder{color:#7b8493!important}
/* Home Feed becomes a clean, flat discovery surface; cards do not get a second housing panel. */
#auto-arcade-widget .aa360-shell{background:#fff!important;color:#101820!important}
#auto-arcade-widget .aa360-feed{background:#fff!important;gap:0!important}
#auto-arcade-widget .aa360-item{background:#fff!important;border:0!important;border-radius:0!important;box-shadow:none!important;color:#101820!important;margin:0!important}
#auto-arcade-widget .aa360-item .aa360-shade{display:none!important}
#auto-arcade-widget .aa360-item .aa360-info{position:relative!important;left:auto!important;right:auto!important;bottom:auto!important;background:#fff!important;color:#101820!important;backdrop-filter:none!important;padding:8px 14px 14px!important}
#auto-arcade-widget .aa360-item .aa360-info *{text-shadow:none!important}
#auto-arcade-widget .aa360-item .aa360-title{color:#101820!important}
#auto-arcade-widget .aa360-item .aa360-desc{display:none!important}
#auto-arcade-widget .aa360-item .aa360-profile-name-surface{background:transparent!important;border:0!important;box-shadow:none!important;padding:0!important}
#auto-arcade-widget .aa360-item .aa360-profile-name-surface img,
#auto-arcade-widget .aa360-item .aa360-avatar{width:30px!important;height:30px!important;min-width:30px!important;border-radius:50%!important}
#auto-arcade-widget .aa360-item .aa360-actions .bingo-neon-action:not([data-bingo-keep-home]){display:none!important}
#auto-arcade-widget .aa360-item .aa360-actions{background:#fff!important;border:0!important;box-shadow:none!important;padding:6px 14px 12px!important}
#auto-arcade-widget .aa360-item .aa360-side-actions{display:none!important}
#auto-arcade-widget .aa360-item .aa360-sound,
#auto-arcade-widget .aa360-item .aa-feed-sound-btn{display:none!important}
@media(max-width:600px){
 #auto-arcade-widget .aa360-item{min-height:auto!important;height:auto!important}
 #auto-arcade-widget .aa360-media,#auto-arcade-widget .aa360-item>video,#auto-arcade-widget .aa360-item>img{max-height:68vh!important}
 #auto-arcade-widget .bingo-approved-topic .aa-post-title{font-size:25px!important}
}
</style>
<script id="bingo-approved-home-wall-behaviour-20261002">
(function(){
 const MARK="bingoHomeWallWired";
 function text(el){return (el&&el.textContent||"").replace(/\\s+/g," ").trim()}
 function wireHome(){
   document.querySelectorAll("#auto-arcade-widget .aa360-item").forEach(card=>{
     if(card.dataset[MARK])return; card.dataset[MARK]="1";
     const buttons=[...card.querySelectorAll("button,a")];
     const original=buttons.find(b=>/view post|comments/i.test(text(b)));
     const share=buttons.find(b=>/share/i.test(text(b)));
     const crown=buttons.find(b=>/crown/i.test(text(b)));
     [crown,original,share].filter(Boolean).forEach(b=>{b.dataset.bingoKeepHome="1";b.style.display=""});
     if(original){
       card.style.cursor="pointer";
       card.addEventListener("click",e=>{
         if(e.target.closest("button,a,input,textarea,video"))return;
         original.click();
       });
     }
   });
 }
 const obs=new MutationObserver(wireHome);
 function start(){const root=document.getElementById("auto-arcade-widget");if(!root)return;wireHome();obs.observe(root,{childList:true,subtree:true})}
 if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",start);else start();
})();
</script>'''
          if "</body>" not in s:
              raise SystemExit("Mother file has no closing body; refusing patch")
          s=s.replace("</body>",patch+"\\n</body>",1)
          p.write_text(s,encoding="utf-8")
      - name: Verify surgical scope
        shell: python
        run: |
          from pathlib import Path
          s=Path("BINGO_MASTER_CURRENT_VERIFIED.html").read_text(encoding="utf-8")
          assert s.count("bingo-approved-home-wall-20261002")==1
          assert "bingo-approved-topic" in s
          assert "aa360-item" in s
          assert "aaTopicComment" in s
          assert "aaTopicShare" in s
          assert "aaTopicLove" in s
      - name: Commit approved Home/Wall patch only
        run: |
          git config user.name "Bingo Deployment Bot"
          git config user.email "actions@users.noreply.github.com"
          git add BINGO_MASTER_CURRENT_VERIFIED.html
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Apply approved view-only Home Feed and flat white Bingo Wall"
          git push origin HEAD:bingo-storage-preview-repair-2026-09-27
