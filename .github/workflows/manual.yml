name: Bingo Next.js Build and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - bingo-final-integration-2026-09-22

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Bingo
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Package existing Bingo master into Pages output
        run: |
          test -f "BINGO_MASTER_CURRENT_VERIFIED.html"
          cp "BINGO_MASTER_CURRENT_VERIFIED.html" "out/BINGO_MASTER_CURRENT_VERIFIED.html"
          if [ -d assets ]; then
            rm -rf out/assets
            cp -R assets out/assets
          fi
          echo "Existing Bingo master and assets packaged without modifying the master."

      - name: Verify static export
        run: |
          test -d out
          test -f out/index.html
          test -f out/BINGO_MASTER_CURRENT_VERIFIED.html
          echo "Bingo static export created successfully."

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Bingo website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy Bingo to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
